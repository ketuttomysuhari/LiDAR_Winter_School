<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A-Frame GLTF Drop Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin:0; background:#0b0f1a; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .drop {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(0,0,0,0.55); color: #fff;
      border: 1px dashed rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
      max-width: 520px;
      line-height: 1.35;
    }
    .drop strong { display:block; margin-bottom:6px; }
    .drop .small { font-size: 13px; opacity: 0.85; }
    .drop.dragover { border-style: solid; }
  </style>
</head>

<body>
  <div id="drop" class="drop">
    <strong>Drop .glb / .gltf here</strong>
    <div class="small">
      Recommended: <b>.glb</b> (single file).<br/>
      If using .gltf with external textures, ensure assets are accessible.
    </div>
  </div>

  <a-scene renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
           background="color: #0b0f1a" vr-mode-ui="enabled: true">
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 4 2"></a-entity>
    <a-plane rotation="-90 0 0" width="50" height="50" color="#111827"></a-plane>

    <a-entity id="model" position="0 0 -3"></a-entity>

    <a-entity position="0 1.6 0">
      <a-camera wasd-controls="acceleration: 25" look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    const drop = document.getElementById('drop');
    const model = document.getElementById('model');

    function setModelFromFile(file){
      const url = URL.createObjectURL(file);
      model.setAttribute('gltf-model', url);

      // Optional: reset transforms
      model.setAttribute('position', '0 0 -3');
      model.setAttribute('rotation', '0 0 0');
      model.setAttribute('scale', '1 1 1');
    }

    function isGltfLike(file){
      const name = (file.name || '').toLowerCase();
      return name.endsWith('.glb') || name.endsWith('.gltf');
    }

    window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
    window.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');

      const file = e.dataTransfer?.files?.[0];
      if (!file) return;

      if (!isGltfLike(file)){
        alert('Please drop a .glb or .gltf file.');
        return;
      }
      setModelFromFile(file);
    });

    model.addEventListener('model-loaded', () => console.log('Model loaded'));
    model.addEventListener('model-error', (e) => console.error('Model error', e.detail));
  </script>
</body>
</html>
