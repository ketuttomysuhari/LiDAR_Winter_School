<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A-Frame GLTF/LAS Viewer (Auto-Ground + Go To Data + RGB)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin:0; background:#0b0f1a; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .panel{
      position: fixed; left: 12px; top: 12px; z-index: 10;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(0,0,0,0.55); color: #fff;
      border: 1px dashed rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
      max-width: 860px;
      line-height: 1.35;
    }
    .panel.dragover { border-style: solid; }
    .small { font-size: 13px; opacity: 0.85; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    label { font-size: 13px; opacity: 0.9; }
    select, input[type="range"]{
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 8px 10px;
      outline: none;
    }
    input[type="range"]{ padding: 0; height: 34px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .status { margin-top: 8px; font-size: 13px; opacity: 0.9; }
    .btn {
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: #fff; cursor: pointer;
    }
  </style>

  <!-- loaders.gl LAS parsing (ESM) -->
  <script type="module">
    import { parse } from 'https://esm.sh/@loaders.gl/core@4.3.4';
    import { LASLoader } from 'https://esm.sh/@loaders.gl/las@4.3.4';

    window.__parseLAS = async function(file) {
      const arrayBuffer = await file.arrayBuffer();
      return await parse(arrayBuffer, LASLoader);
    };
  </script>
</head>

<body>
  <div id="drop" class="panel">
    <strong>Drop files here: <span class="mono">.glb / .gltf / .las</span></strong>
    <div class="small">
      GLB/GLTF loads as mesh. LAS loads as point cloud with RGB/scalar coloring.<br/>
      After loading, the camera will automatically move to (frame) the data.
    </div>

    <div class="row">
      <label for="colorBy">Color by</label>
      <select id="colorBy">
        <option value="rgb">RGB (if available)</option>
        <option value="z" selected>Elevation (Z) — grayscale</option>
        <option value="intensity">Intensity — grayscale</option>
        <option value="classification">Classification — grayscale</option>
      </select>

      <label for="ptSize">Point size</label>
      <input id="ptSize" type="range" min="1" max="10" step="1" value="2" />
      <span class="mono" id="ptSizeVal">2</span>

      <button class="btn" id="goBtn">Go to data</button>
      <button class="btn" id="clearLas">Clear LAS</button>
    </div>

    <div class="status" id="status">Ready.</div>
  </div>

  <a-scene renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
           background="color: #0b0f1a" vr-mode-ui="enabled: true">

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 4 2"></a-entity>

    <!-- Ground at Y=0 -->
    <a-plane rotation="-90 0 0" width="120" height="120" color="#111827"
             material="roughness:1; metalness:0"></a-plane>

    <!-- Model entity -->
    <a-entity id="model" position="0 0 -3"></a-entity>

    <!-- Camera rig -->
    <a-entity id="rig" position="0 1.6 8">
      <a-camera id="cam" wasd-controls="acceleration: 25"
                look-controls="pointerLockEnabled: false" fov="70"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    const drop = document.getElementById('drop');
    const statusEl = document.getElementById('status');

    const colorByEl = document.getElementById('colorBy');
    const ptSizeEl = document.getElementById('ptSize');
    const ptSizeVal = document.getElementById('ptSizeVal');
    const clearLasBtn = document.getElementById('clearLas');
    const goBtn = document.getElementById('goBtn');

    const sceneEl = document.querySelector('a-scene');
    const modelEl = document.getElementById('model');
    const rigEl = document.getElementById('rig');
    const camEl = document.getElementById('cam');

    let currentLas = null;   // { points, geometry, material, lasData }
    let lastFocusTarget = null; // THREE.Object3D (mesh or points)

    function setStatus(msg){ statusEl.textContent = msg; }

    function isGltfLike(file){
      const n = (file.name || '').toLowerCase();
      return n.endsWith('.glb') || n.endsWith('.gltf');
    }
    function isLas(file){
      const n = (file.name || '').toLowerCase();
      return n.endsWith('.las');
    }

    // --- Auto-ground helper: make minY touch Y=0
    function groundObject3D(obj3d){
      obj3d.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(obj3d);
      const minY = box.min.y;
      if (Number.isFinite(minY)) obj3d.position.y -= minY;
    }

    // --- Go to data / Frame object (camera)
    function frameObject(obj3d){
      if (!obj3d) return;

      obj3d.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(obj3d);

      const size = new THREE.Vector3();
      box.getSize(size);

      const center = new THREE.Vector3();
      box.getCenter(center);

      // Compute a good distance based on FOV and object size
      const camObj = camEl.getObject3D('camera');
      const fov = (camObj?.fov ?? 70) * Math.PI / 180.0;

      const maxDim = Math.max(size.x, size.y, size.z);
      const fitHeightDistance = (maxDim / 2) / Math.tan(fov / 2);
      const fitDistance = fitHeightDistance * 1.25; // padding

      // Place rig so camera looks toward center from +Z direction
      // We keep a slightly elevated view by adding some Y offset.
      const newPos = new THREE.Vector3(center.x, center.y + maxDim * 0.15, center.z + fitDistance);

      rigEl.object3D.position.copy(newPos);

      // Aim camera at center
      rigEl.object3D.lookAt(center);

      setStatus('Camera moved to data.');
    }

    // --- GLTF loader
    function setModelFromFile(file){
      const url = URL.createObjectURL(file);

      modelEl.object3D.position.set(0, 0, -3);
      modelEl.object3D.rotation.set(0, 0, 0);
      modelEl.object3D.scale.set(1, 1, 1);

      modelEl.setAttribute('gltf-model', url);
      setStatus(`Loading model: ${file.name} ...`);
    }

    modelEl.addEventListener('model-loaded', () => {
      const mesh = modelEl.getObject3D('mesh');
      if (!mesh) return;

      mesh.updateWorldMatrix(true, true);

      // Auto-ground entity using bbox of mesh
      const box = new THREE.Box3().setFromObject(mesh);
      const minY = box.min.y;
      if (Number.isFinite(minY)) modelEl.object3D.position.y -= minY;

      // After grounding, update target + frame camera
      // (recompute mesh bbox after shifting)
      mesh.updateWorldMatrix(true, true);
      lastFocusTarget = modelEl.object3D;
      frameObject(modelEl.object3D);

      setStatus('Model loaded + grounded + framed.');
    });

    modelEl.addEventListener('model-error', (e) => {
      console.error('GLTF model error', e.detail);
      setStatus('Error loading model.');
    });

    // ----------------------------
    // LAS: attribute helpers + coloring
    // ----------------------------
    function getAttr(lasData, keys){
      for (const k of keys) {
        const v = lasData?.attributes?.[k]?.value;
        if (v && v.length) return v;
      }
      return null;
    }

    function computeMinMax(arr, n){
      let min = Infinity, max = -Infinity;
      for (let i = 0; i < n; i++) {
        const x = arr[i];
        if (!Number.isFinite(x)) continue;
        if (x < min) min = x;
        if (x > max) max = x;
      }
      if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) { min = 0; max = 1; }
      return { min, max };
    }

    function ensureColor(geometry, n){
      let c = geometry.getAttribute('color');
      if (!c || c.count !== n) {
        geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        c = geometry.getAttribute('color');
      }
      return c;
    }

    // Attempt to interpret RGB array either as:
    // - Uint8: 0..255
    // - Uint16: 0..65535
    function rgbNormalizeFactor(rgbArray){
      // Heuristic: if max > 255, treat as 16-bit
      let max = 0;
      const len = Math.min(rgbArray.length, 3000); // sample
      for (let i = 0; i < len; i++) {
        if (rgbArray[i] > max) max = rgbArray[i];
      }
      return (max > 255) ? (1 / 65535.0) : (1 / 255.0);
    }

    function applyLasColoring(mode){
      if (!currentLas) return;

      const { geometry, material, lasData } = currentLas;
      const posAttr = geometry.getAttribute('position');
      const n = posAttr.count;

      const colorAttr = ensureColor(geometry, n);
      const colors = colorAttr.array;

      const rgb = getAttr(lasData, ['COLOR_0', 'COLOR', 'RGB', 'rgb']);
      const intensity = getAttr(lasData, ['INTENSITY', 'intensity']);
      const classification = getAttr(lasData, ['CLASSIFICATION', 'classification']);

      if (mode === 'rgb' && rgb && rgb.length >= n * 3) {
        const k = rgbNormalizeFactor(rgb);
        for (let i = 0; i < n; i++) {
          const r = rgb[i*3]   * k;
          const g = rgb[i*3+1] * k;
          const b = rgb[i*3+2] * k;
          colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
        }
        setStatus('LAS colored by RGB.');
      } else {
        // scalar -> grayscale
        if (mode === 'intensity' && intensity && intensity.length >= n) {
          const { min, max } = computeMinMax(intensity, n);
          const inv = 1.0 / (max - min);
          for (let i = 0; i < n; i++) {
            const v = (intensity[i] - min) * inv;
            const g = Math.min(1, Math.max(0, v));
            colors[i*3] = g; colors[i*3+1] = g; colors[i*3+2] = g;
          }
          setStatus('LAS colored by Intensity (grayscale).');
        } else if (mode === 'classification' && classification && classification.length >= n) {
          const { min, max } = computeMinMax(classification, n);
          const inv = 1.0 / (max - min);
          for (let i = 0; i < n; i++) {
            const v = (classification[i] - min) * inv;
            const g = Math.min(1, Math.max(0, v));
            colors[i*3] = g; colors[i*3+1] = g; colors[i*3+2] = g;
          }
          setStatus('LAS colored by Classification (grayscale).');
        } else {
          // elevation Z from positions
          const p = posAttr.array;
          let zMin = Infinity, zMax = -Infinity;
          for (let i = 0; i < n; i++) {
            const z = p[i*3 + 2];
            if (z < zMin) zMin = z;
            if (z > zMax) zMax = z;
          }
          if (!Number.isFinite(zMin) || !Number.isFinite(zMax) || zMin === zMax) { zMin = 0; zMax = 1; }
          const inv = 1.0 / (zMax - zMin);

          for (let i = 0; i < n; i++) {
            const z = p[i*3 + 2];
            const v = (z - zMin) * inv;
            const g = Math.min(1, Math.max(0, v));
            colors[i*3] = g; colors[i*3+1] = g; colors[i*3+2] = g;
          }
          setStatus('LAS colored by Elevation Z (grayscale).');
        }
      }

      colorAttr.needsUpdate = true;
      material.vertexColors = true;
      material.needsUpdate = true;
    }

    function setPointSize(px){
      if (!currentLas) return;
      currentLas.material.size = px;               // pixel-like size
      currentLas.material.sizeAttenuation = false; // constant pixel size
      currentLas.material.needsUpdate = true;
    }

    async function setLasFromFile(file){
      if (!window.__parseLAS) {
        alert('LAS parser not ready. Refresh and try again.');
        return;
      }

      // remove old LAS
      if (currentLas?.points) {
        sceneEl.object3D.remove(currentLas.points);
        currentLas.geometry?.dispose?.();
        currentLas.material?.dispose?.();
        currentLas = null;
      }

      setStatus(`Parsing LAS: ${file.name} ...`);
      const lasData = await window.__parseLAS(file);

      const positions = getAttr(lasData, ['POSITION']);
      if (!positions || positions.length < 3) {
        setStatus('LAS parsed but no POSITION found.');
        return;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        size: 2,
        sizeAttenuation: false,
        vertexColors: true
      });

      const points = new THREE.Points(geometry, material);
      points.position.set(0, 0, -3);

      // Auto-ground and add to scene
      groundObject3D(points);
      sceneEl.object3D.add(points);

      currentLas = { points, geometry, material, lasData };

      // Apply user settings
      applyLasColoring(colorByEl.value);
      setPointSize(parseInt(ptSizeEl.value, 10));

      // Focus camera on LAS
      lastFocusTarget = points;
      frameObject(points);

      setStatus(`LAS loaded + grounded + framed: ${file.name}`);
    }

    // UI
    colorByEl.addEventListener('change', () => applyLasColoring(colorByEl.value));
    ptSizeEl.addEventListener('input', () => {
      ptSizeVal.textContent = ptSizeEl.value;
      setPointSize(parseInt(ptSizeEl.value, 10));
    });

    clearLasBtn.addEventListener('click', () => {
      if (currentLas?.points) {
        sceneEl.object3D.remove(currentLas.points);
        currentLas.geometry?.dispose?.();
        currentLas.material?.dispose?.();
      }
      currentLas = null;
      setStatus('LAS cleared.');
    });

    goBtn.addEventListener('click', () => {
      if (lastFocusTarget) frameObject(lastFocusTarget);
      else setStatus('No data to focus yet.');
    });

    // Drag/drop
    window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
    window.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');

      const file = e.dataTransfer?.files?.[0];
      if (!file) return;

      try {
        if (isGltfLike(file)) {
          setModelFromFile(file);
          return;
        }
        if (isLas(file)) {
          await setLasFromFile(file);
          return;
        }
        alert('Unsupported file. Use .glb, .gltf, or .las');
      } catch (err) {
        console.error(err);
        alert('Failed to load file. See console for details.');
      }
    });
  </script>
</body>
</html>
