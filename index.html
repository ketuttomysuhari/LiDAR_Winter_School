<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A-Frame GLTF Auto-Ground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin:0; background:#0b0f1a; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      padding: 12px 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      backdrop-filter: blur(8px);
    }
    .ui input {
      width: 420px; max-width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="ui">
  <strong>GLTF / GLB URL</strong><br>
  <input id="url"
    value="https://cdn.aframe.io/test-models/models/glTF/Duck/glTF-Binary/Duck.glb">
</div>

<a-scene
  renderer="colorManagement: true; physicallyCorrectLights: true"
  background="color: #0b0f1a">

  <!-- Lighting -->
  <a-entity light="type: ambient; intensity: 0.6"></a-entity>
  <a-entity light="type: directional; intensity: 1.2" position="3 5 2"></a-entity>

  <!-- Ground (Y = 0) -->
  <a-plane
    rotation="-90 0 0"
    width="50"
    height="50"
    color="#111827"
    material="roughness:1; metalness:0">
  </a-plane>

  <!-- Model -->
  <a-entity id="model"></a-entity>

  <!-- Camera -->
  <a-entity position="0 1.6 4">
    <a-camera wasd-controls look-controls></a-camera>
  </a-entity>

</a-scene>

<script>
const input = document.getElementById('url');
const modelEl = document.getElementById('model');

function loadModel(url) {
  modelEl.setAttribute('gltf-model', url);
}

input.addEventListener('change', () => loadModel(input.value));

/**
 * AUTO PLACE MODEL ON GROUND
 */
modelEl.addEventListener('model-loaded', () => {
  const mesh = modelEl.getObject3D('mesh');
  if (!mesh) return;

  // Compute bounding box
  const box = new THREE.Box3().setFromObject(mesh);
  const minY = box.min.y;

  // Move model so bottom touches Y=0
  modelEl.object3D.position.y -= minY;

  console.log('Model grounded. minY:', minY);
});

// Initial load
loadModel(input.value);
</script>

</body>
</html>
