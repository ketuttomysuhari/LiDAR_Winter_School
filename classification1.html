<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Local LAS 1.4 Viewer (Static vs Dynamic) - Pure HTML+JS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b1220; color:#e5e7eb;}
    #ui {
      position:absolute; left:12px; top:12px; width:360px; bottom:12px;
      overflow:auto; padding:12px; border-radius:14px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
    }
    h1 { font-size:14px; margin:0 0 10px; }
    .card { background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:10px; margin:10px 0; }
    label { font-size:12px; color:#cbd5e1; display:block; margin-top:8px; }
    input, select, button { width:100%; box-sizing:border-box; }
    input[type="range"] { width:100%; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    button {
      padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.08); color:#e5e7eb; cursor:pointer;
    }
    button:hover { background:rgba(255,255,255,0.12); }
    pre { white-space: pre-wrap; word-break: break-word; font-size:12px; margin:8px 0 0; }
    #canvasWrap { position:absolute; left:0; top:0; right:0; bottom:0; }
    #hist { width:100%; height:120px; border-radius:10px; border:1px solid rgba(255,255,255,0.10); background:rgba(0,0,0,0.25); }
    #status { font-size:12px; color:#9ca3af; margin-top:6px; line-height:1.35; }
  </style>

  <!-- Three.js via UNPKG (no bare imports) -->
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.174.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.174.0/examples/jsm/controls/OrbitControls.js";

    // ----------------------------
    // Minimal LAS reader (LAS 1.2–1.4)
    // Supports point formats 0–10 for XYZ/intensity/classification, RGB when present.
    // ----------------------------
    function readString(view, offset, length){
      let s = "";
      for(let i=0;i<length;i++){
        const c = view.getUint8(offset+i);
        if(c===0) break;
        s += String.fromCharCode(c);
      }
      return s.trim();
    }

    function readUInt64LE(view, offset){
      // JS number precise up to 2^53-1; LAS files typically safe for offsets
      const lo = view.getUint32(offset, true);
      const hi = view.getUint32(offset+4, true);
      return hi * 4294967296 + lo;
    }

    function parseLASHeader(buffer){
      const view = new DataView(buffer);

      const fileSig = readString(view, 0, 4);
      if(fileSig !== "LASF") throw new Error("Not a LAS file (missing LASF signature).");

      const versionMajor = view.getUint8(24);
      const versionMinor = view.getUint8(25);

      const systemId = readString(view, 26, 32);
      const generatingSoftware = readString(view, 58, 32);

      const headerSize = view.getUint16(94, true);

      // LAS 1.4: offset_to_point_data at 96 (uint32), num_vlrs at 100 (uint32)
      const offsetToPointData = view.getUint32(96, true);
      const numVLRs = view.getUint32(100, true);

      // Point format + record length
      const pointFormat = view.getUint8(104);
      const pointRecordLength = view.getUint16(105, true);

      // point count (LAS 1.4 has legacy + EVLR), but we read legacy at 107 (uint32)
      const legacyPointCount = view.getUint32(107, true);

      // scales & offsets
      const xScale = view.getFloat64(131, true);
      const yScale = view.getFloat64(139, true);
      const zScale = view.getFloat64(147, true);

      const xOffset = view.getFloat64(155, true);
      const yOffset = view.getFloat64(163, true);
      const zOffset = view.getFloat64(171, true);

      // bounds
      const maxX = view.getFloat64(179, true);
      const minX = view.getFloat64(187, true);
      const maxY = view.getFloat64(195, true);
      const minY = view.getFloat64(203, true);
      const maxZ = view.getFloat64(211, true);
      const minZ = view.getFloat64(219, true);

      // LAS 1.4 extended point count at offset 247 (uint64) if headerSize >= 375
      let pointCount = legacyPointCount;
      if(headerSize >= 375){
        const extPointCount = readUInt64LE(view, 247);
        if(extPointCount > 0) pointCount = extPointCount;
      }

      return {
        fileSig, versionMajor, versionMinor,
        systemId, generatingSoftware,
        headerSize, offsetToPointData, numVLRs,
        pointFormat, pointRecordLength,
        pointCount,
        scale: {xScale, yScale, zScale},
        offset: {xOffset, yOffset, zOffset},
        bounds: {minX, maxX, minY, maxY, minZ, maxZ}
      };
    }

    function hasRGB(pointFormat){
      // RGB is in formats 2,3,5,7,8,10 (standard LAS)
      return [2,3,5,7,8,10].includes(pointFormat);
    }

    function pointHasGPS(pointFormat){
      // GPS time common in 1,3,4,5,6,7,8,9,10
      return [1,3,4,5,6,7,8,9,10].includes(pointFormat);
    }

    function parsePoints(buffer, header, opts){
      const view = new DataView(buffer);
      const {
        maxPoints = 2_000_000,
        stride = 1,
        zMin = -Infinity, zMax = Infinity,
        useROI = false,
        roi = null // {minX,maxX,minY,maxY,minZ,maxZ} in REAL coords
      } = opts;

      const n = Number(header.pointCount);
      const recLen = header.pointRecordLength;
      const base = header.offsetToPointData;

      // Sampling to cap memory
      const step = Math.max(1, stride);
      const cap = Math.min(maxPoints, Math.ceil(n / step));

      const positions = new Float32Array(cap * 3);
      const intensities = new Float32Array(cap);
      const classifications = new Uint16Array(cap);
      const colors = new Uint8Array(cap * 3);

      const rgb = hasRGB(header.pointFormat);

      let count = 0;

      // Precompute scales/offsets
      const sx = header.scale.xScale, sy = header.scale.yScale, sz = header.scale.zScale;
      const ox = header.offset.xOffset, oy = header.offset.yOffset, oz = header.offset.zOffset;

      for(let i=0; i<n; i+=step){
        const off = base + i * recLen;

        // LAS point record begins with int32 X/Y/Z at 0/4/8
        const Xi = view.getInt32(off + 0, true);
        const Yi = view.getInt32(off + 4, true);
        const Zi = view.getInt32(off + 8, true);

        const X = Xi * sx + ox;
        const Y = Yi * sy + oy;
        const Z = Zi * sz + oz;

        if(Z < zMin || Z > zMax) continue;

        if(useROI && roi){
          if(X < roi.minX || X > roi.maxX || Y < roi.minY || Y > roi.maxY || Z < roi.minZ || Z > roi.maxZ) continue;
        }

        // intensity: uint16 at offset 12 for all common formats
        const intensity = view.getUint16(off + 12, true);

        // classification:
        // For point formats 0–5: classification byte at offset 15
        // For point formats 6–10: classification at offset 16 (after flags byte at 14, classification at 15? Actually 6–10: 14=flags, 15=classification, 16=user data, 17=scan angle)
        // We handle robustly by reading both candidates and picking non-zero if possible.
        let cls = 0;
        if(header.pointFormat <= 5){
          cls = view.getUint8(off + 15);
        }else{
          cls = view.getUint8(off + 15);
        }

        // RGB offsets (standard): last 6 bytes of record for RGB (uint16 each)
        let r=180, g=180, b=180;
        if(rgb){
          // Many files store 16-bit RGB; map to 8-bit
          const rgbOff = off + recLen - 6;
          const R16 = view.getUint16(rgbOff + 0, true);
          const G16 = view.getUint16(rgbOff + 2, true);
          const B16 = view.getUint16(rgbOff + 4, true);
          r = Math.min(255, (R16 / 256) | 0);
          g = Math.min(255, (G16 / 256) | 0);
          b = Math.min(255, (B16 / 256) | 0);
        }

        const j = count * 3;
        positions[j+0] = X;
        positions[j+1] = Y;
        positions[j+2] = Z;

        intensities[count] = intensity;
        classifications[count] = cls;

        colors[j+0] = r; colors[j+1] = g; colors[j+2] = b;

        count++;
        if(count >= cap) break;
      }

      return {
        count,
        positions: positions.subarray(0, count*3),
        intensities: intensities.subarray(0, count),
        classifications: classifications.subarray(0, count),
        colors: colors.subarray(0, count*3),
      };
    }

    function computeHistogram(values, minV, maxV, bins=64){
      const h = new Array(bins).fill(0);
      const range = maxV - minV;
      if(range <= 0) return h;
      for(let i=0;i<values.length;i++){
        const v = values[i];
        if(v < minV || v > maxV) continue;
        const t = (v - minV)/range;
        const b = Math.max(0, Math.min(bins-1, Math.floor(t * bins)));
        h[b]++;
      }
      return h;
    }

    function drawHistogram(canvas, hist){
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0,0,w,h);

      const maxC = Math.max(...hist, 1);
      const bins = hist.length;
      const pad = 10;
      const bw = (w - 2*pad) / bins;

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      for(let i=0;i<bins;i++){
        const barH = (hist[i]/maxC) * (h - 2*pad);
        const x = pad + i*bw;
        const y = h - pad - barH;
        ctx.fillRect(x, y, Math.max(1, bw-1), barH);
      }

      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "12px system-ui, Arial";
      ctx.fillText("Intensity histogram (sampled points)", 10, 16);
    }

    function colorize(points, mode, params){
      const { colors, intensities, classifications, positions } = points;
      const n = points.count;

      const out = new Uint8Array(n*3);

      if(mode === "rgb"){
        out.set(colors);
        return out;
      }

      if(mode === "intensity"){
        const minI = params.minI ?? 0;
        const maxI = params.maxI ?? 65535;
        const range = Math.max(1, maxI - minI);
        for(let i=0;i<n;i++){
          const t = Math.max(0, Math.min(1, (intensities[i]-minI)/range));
          const v = (t*255)|0;
          out[i*3+0]=v; out[i*3+1]=v; out[i*3+2]=v;
        }
        return out;
      }

      if(mode === "height"){
        let minZ = params.minZ, maxZ = params.maxZ;
        if(minZ == null || maxZ == null){
          // compute from sampled points
          minZ = Infinity; maxZ = -Infinity;
          for(let i=0;i<n;i++){
            const z = positions[i*3+2];
            if(z<minZ) minZ=z;
            if(z>maxZ) maxZ=z;
          }
        }
        const range = Math.max(1e-9, maxZ - minZ);
        for(let i=0;i<n;i++){
          const z = positions[i*3+2];
          const t = Math.max(0, Math.min(1, (z-minZ)/range));
          // simple gradient: blue->cyan->green->yellow->red
          const r = Math.max(0, Math.min(255, Math.floor(255 * Math.max(0, (t-0.5)*2))));
          const b = Math.max(0, Math.min(255, Math.floor(255 * Math.max(0, (0.5-t)*2))));
          const g = 255 - Math.max(r,b);
          out[i*3+0]=r; out[i*3+1]=g; out[i*3+2]=b;
        }
        return out;
      }

      if(mode === "classification"){
        // basic LAS classes palette
        const palette = new Map([
          [0,[200,200,200]], [1,[220,220,255]], [2,[120,200,120]], [3,[255,220,120]],
          [4,[255,120,120]], [5,[160,120,200]], [6,[120,120,255]], [7,[255,255,120]],
          [8,[120,255,255]], [9,[255,120,255]], [10,[255,180,180]]
        ]);
        for(let i=0;i<n;i++){
          const c = classifications[i];
          const p = palette.get(c) || [180,180,180];
          out[i*3+0]=p[0]; out[i*3+1]=p[1]; out[i*3+2]=p[2];
        }
        return out;
      }

      out.set(colors);
      return out;
    }

    // ----------------------------
    // Simple voxel-based comparison (density + mean Z difference)
    // ----------------------------
    function compareVoxel(staticPts, dynamicPts, voxelSize){
      // Returns summary statistics (lightweight, no huge maps)
      const vs = Math.max(0.01, voxelSize);

      // Build voxel map for static: key -> {count, sumZ}
      const map = new Map();
      const sp = staticPts.positions;
      const sn = staticPts.count;

      for(let i=0;i<sn;i++){
        const x = sp[i*3+0], y = sp[i*3+1], z = sp[i*3+2];
        const ix = Math.floor(x/vs), iy = Math.floor(y/vs), iz = Math.floor(z/vs);
        const key = `${ix},${iy},${iz}`;
        const v = map.get(key);
        if(v) { v.count++; v.sumZ += z; }
        else { map.set(key, {count:1, sumZ:z}); }
      }

      // Compare dynamic
      const dp = dynamicPts.positions;
      const dn = dynamicPts.count;

      let overlap = 0;
      let dynOnly = 0;

      // For Z difference: compare voxel mean Zs where overlap exists (same voxel)
      let zDiffSum = 0;
      let zDiffN = 0;

      // density ratio (avg points per occupied voxel)
      let staticVox = map.size;

      // Build dynamic occupancy quick
      const dynMap = new Map();
      for(let i=0;i<dn;i++){
        const x = dp[i*3+0], y = dp[i*3+1], z = dp[i*3+2];
        const ix = Math.floor(x/vs), iy = Math.floor(y/vs), iz = Math.floor(z/vs);
        const key = `${ix},${iy},${iz}`;
        const v = dynMap.get(key);
        if(v) { v.count++; v.sumZ += z; }
        else { dynMap.set(key, {count:1, sumZ:z}); }
      }

      for(const [key, dv] of dynMap.entries()){
        const sv = map.get(key);
        if(sv){
          overlap++;
          const sz = sv.sumZ / sv.count;
          const dz = dv.sumZ / dv.count;
          zDiffSum += (dz - sz);
          zDiffN++;
        }else{
          dynOnly++;
        }
      }

      const staticAvgDensity = sn / Math.max(1, staticVox);
      const dynamicAvgDensity = dn / Math.max(1, dynMap.size);
      const meanZDiff = zDiffN ? (zDiffSum / zDiffN) : 0;

      return {
        voxelSize: vs,
        static: {sampledPoints: sn, occupiedVoxels: staticVox, avgPtsPerVoxel: staticAvgDensity},
        dynamic:{sampledPoints: dn, occupiedVoxels: dynMap.size, avgPtsPerVoxel: dynamicAvgDensity},
        overlapVoxels: overlap,
        dynamicOnlyVoxels: dynOnly,
        meanZDiff_dynamic_minus_static: meanZDiff
      };
    }

    // ----------------------------
    // Three.js scene
    // ----------------------------
    const canvasWrap = document.getElementById("canvasWrap");
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0b1220, 1);
    document.getElementById("canvasWrap").appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b1220, 20, 8000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1e9);
    camera.position.set(0, -50, 30);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights (minimal)
    const amb = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(amb);

    // Axis helper (optional)
    const axes = new THREE.AxesHelper(10);
    scene.add(axes);

    // Layer state
    const layers = {
      static: { points: null, data: null, header: null, name: "STATIC" },
      dynamic:{ points: null, data: null, header: null, name: "DYNAMIC" }
    };

    function buildPointCloud(layerKey){
      const layer = layers[layerKey];
      if(!layer.data) return;

      // Geometry
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(layer.data.positions, 3));

      // initial colors
      const mode = document.getElementById("colorMode").value;
      const minI = Number(document.getElementById("iMin").value);
      const maxI = Number(document.getElementById("iMax").value);
      const col = colorize(layer.data, mode, {minI, maxI});
      geom.setAttribute("color", new THREE.BufferAttribute(col, 3, true));

      geom.computeBoundingBox();

      const mat = new THREE.PointsMaterial({
        size: Number(document.getElementById("ptSize").value),
        vertexColors: true,
        transparent: true,
        opacity: Number(document.getElementById("opacity").value),
        depthTest: true
      });

      const pts = new THREE.Points(geom, mat);
      pts.name = layer.name;

      // replace old
      if(layer.points) scene.remove(layer.points);
      layer.points = pts;
      scene.add(pts);

      fitView();
      updateMeta();
      updateHistogramFor(layerKey);
    }

    function fitView(){
      // Fit to whichever is visible and loaded
      const boxes = [];
      for(const k of ["static","dynamic"]){
        const p = layers[k].points;
        const vis = document.getElementById(k === "static" ? "chkStatic" : "chkDynamic").checked;
        if(p && vis){
          const bb = p.geometry.boundingBox;
          if(bb) boxes.push(bb);
        }
      }
      if(!boxes.length) return;

      const merged = boxes[0].clone();
      for(let i=1;i<boxes.length;i++) merged.union(boxes[i]);

      const center = new THREE.Vector3();
      merged.getCenter(center);

      const size = new THREE.Vector3();
      merged.getSize(size);
      const radius = Math.max(size.x, size.y, size.z) * 0.6;

      controls.target.copy(center);
      camera.position.copy(center.clone().add(new THREE.Vector3(0, -radius*1.8, radius*0.9)));
      controls.update();
    }

    function applyStyleToLayer(layerKey){
      const layer = layers[layerKey];
      if(!layer.points) return;

      layer.points.material.size = Number(document.getElementById("ptSize").value);
      layer.points.material.opacity = Number(document.getElementById("opacity").value);

      // recolor
      const mode = document.getElementById("colorMode").value;
      const minI = Number(document.getElementById("iMin").value);
      const maxI = Number(document.getElementById("iMax").value);

      const col = colorize(layer.data, mode, {minI, maxI});
      const attr = layer.points.geometry.getAttribute("color");
      if(attr && attr.array.length === col.length){
        attr.array.set(col);
        attr.needsUpdate = true;
      }

      // classification filter (optional, hide non-selected by alpha trick not available with PointsMaterial easily)
      // We do "hard filter" by rebuilding geometry if filter is set.
    }

    function setVisibility(){
      if(layers.static.points) layers.static.points.visible = document.getElementById("chkStatic").checked;
      if(layers.dynamic.points) layers.dynamic.points.visible = document.getElementById("chkDynamic").checked;
    }

    function updateMeta(){
      const meta = {};
      for(const k of ["static","dynamic"]){
        const h = layers[k].header;
        const d = layers[k].data;
        meta[k] = h ? {
          version: `${h.versionMajor}.${h.versionMinor}`,
          pointFormat: h.pointFormat,
          pointRecordLength: h.pointRecordLength,
          pointCount_in_file: h.pointCount,
          points_loaded_sampled: d?.count ?? 0,
          scale: h.scale,
          offset: h.offset,
          bounds: h.bounds,
          systemId: h.systemId,
          generatingSoftware: h.generatingSoftware
        } : "(not loaded)";
      }
      document.getElementById("meta").textContent = JSON.stringify(meta, null, 2);
    }

    function updateHistogramFor(layerKey){
      const layer = layers[layerKey];
      if(!layer.data) return;

      const minI = Number(document.getElementById("iMin").value);
      const maxI = Number(document.getElementById("iMax").value);
      const hist = computeHistogram(layer.data.intensities, minI, maxI, 64);

      const canvas = document.getElementById("hist");
      // Ensure proper resolution
      const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
      const dpr = devicePixelRatio || 1;
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr,0,0,dpr,0,0);

      drawHistogram(canvas, hist);
    }

    async function loadLASFile(file, layerKey){
      const status = document.getElementById("status");
      status.textContent = `Loading ${layerKey.toUpperCase()} ...`;

      const buf = await file.arrayBuffer();
      const header = parseLASHeader(buf);

      // Sampling controls
      const maxPoints = Number(document.getElementById("maxPoints").value);
      const stride = Number(document.getElementById("stride").value);

      // Optional Z filter
      const zMin = Number(document.getElementById("zMin").value);
      const zMax = Number(document.getElementById("zMax").value);

      // Classification filter (hard filter)
      const clsText = document.getElementById("classList").value.trim();
      const want = clsText ? new Set(clsText.split(",").map(s => parseInt(s.trim(),10)).filter(n => Number.isFinite(n))) : null;

      // Parse points (sampled)
      const pts = parsePoints(buf, header, {maxPoints, stride, zMin, zMax});

      // If classification filter set: rebuild arrays filtered
      let data = pts;
      if(want){
        const n = pts.count;
        const keepIdx = [];
        for(let i=0;i<n;i++){
          if(want.has(pts.classifications[i])) keepIdx.push(i);
        }
        const m = keepIdx.length;
        const pos = new Float32Array(m*3);
        const inten = new Float32Array(m);
        const cls = new Uint16Array(m);
        const col = new Uint8Array(m*3);
        for(let j=0;j<m;j++){
          const i = keepIdx[j];
          pos[j*3+0]=pts.positions[i*3+0];
          pos[j*3+1]=pts.positions[i*3+1];
          pos[j*3+2]=pts.positions[i*3+2];
          inten[j]=pts.intensities[i];
          cls[j]=pts.classifications[i];
          col[j*3+0]=pts.colors[i*3+0];
          col[j*3+1]=pts.colors[i*3+1];
          col[j*3+2]=pts.colors[i*3+2];
        }
        data = {count:m, positions:pos, intensities:inten, classifications:cls, colors:col};
      }

      layers[layerKey].header = header;
      layers[layerKey].data = data;

      buildPointCloud(layerKey);

      status.textContent =
        `${layerKey.toUpperCase()} loaded: sampled ${data.count.toLocaleString()} points (from file count ${Number(header.pointCount).toLocaleString()}).`;
    }

    // Cross section (simple): keep points within Z band around a plane Z = z0
    function applyCrossSection(){
      const enabled = document.getElementById("crossEnable").checked;
      const z0 = Number(document.getElementById("crossZ").value);
      const half = Number(document.getElementById("crossHalf").value);

      const active = document.getElementById("activeLayer").value;
      const layer = layers[active];
      if(!layer.header) return;

      // If disabled: reload style only (no rebuild)
      if(!enabled){
        buildPointCloud(active);
        return;
      }

      // Filter from original sampled data currently in layer.data (note: if already filtered, re-filter)
      const src = layer.data;
      const n = src.count;

      const keep = [];
      for(let i=0;i<n;i++){
        const z = src.positions[i*3+2];
        if(Math.abs(z - z0) <= half) keep.push(i);
      }

      const m = keep.length;
      const pos = new Float32Array(m*3);
      const inten = new Float32Array(m);
      const cls = new Uint16Array(m);
      const col = new Uint8Array(m*3);

      for(let j=0;j<m;j++){
        const i = keep[j];
        pos[j*3+0]=src.positions[i*3+0];
        pos[j*3+1]=src.positions[i*3+1];
        pos[j*3+2]=src.positions[i*3+2];
        inten[j]=src.intensities[i];
        cls[j]=src.classifications[i];
        col[j*3+0]=src.colors[i*3+0];
        col[j*3+1]=src.colors[i*3+1];
        col[j*3+2]=src.colors[i*3+2];
      }

      layers[active].data = {count:m, positions:pos, intensities:inten, classifications:cls, colors:col};
      buildPointCloud(active);
    }

    function runCompare(){
      const s = layers.static.data;
      const d = layers.dynamic.data;
      if(!s || !d){
        alert("Load BOTH static and dynamic first.");
        return;
      }
      const voxel = Number(document.getElementById("voxel").value);
      const res = compareVoxel(s, d, voxel);
      document.getElementById("compareOut").textContent = JSON.stringify(res, null, 2);
    }

    // ----------------------------
    // UI wiring
    // ----------------------------
    function bindUI(){
      // file loaders
      document.getElementById("fileStatic").addEventListener("change", (e)=>{
        const f = e.target.files?.[0];
        if(f) loadLASFile(f, "static").catch(err => alert(err.message));
      });
      document.getElementById("fileDynamic").addEventListener("change", (e)=>{
        const f = e.target.files?.[0];
        if(f) loadLASFile(f, "dynamic").catch(err => alert(err.message));
      });

      // style controls
      ["ptSize","opacity","colorMode","iMin","iMax"].forEach(id=>{
        document.getElementById(id).addEventListener("input", ()=>{
          const active = document.getElementById("activeLayer").value;
          if(layers[active].points) applyStyleToLayer(active);
          updateHistogramFor(active);
        });
      });

      // visibility
      ["chkStatic","chkDynamic"].forEach(id=>{
        document.getElementById(id).addEventListener("change", ()=>{ setVisibility(); });
      });

      document.getElementById("btnRebuild").addEventListener("click", ()=>{
        // Re-parse needed for stride/maxPoints/class filter/z-range changes
        alert("Untuk perubahan stride/maxPoints/z-range/class filter, klik Load ulang file (pilih file lagi).");
      });

      document.getElementById("btnFit").addEventListener("click", ()=>fitView());
      document.getElementById("btnHist").addEventListener("click", ()=>{
        const active = document.getElementById("activeLayer").value;
        updateHistogramFor(active);
      });

      // cross section
      ["crossEnable","crossZ","crossHalf"].forEach(id=>{
        document.getElementById(id).addEventListener("input", ()=>applyCrossSection());
      });

      // compare
      document.getElementById("btnCompare").addEventListener("click", ()=>runCompare());
    }

    // ----------------------------
    // Animation loop
    // ----------------------------
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // init UI after DOM exists
    window.addEventListener("DOMContentLoaded", ()=>{
      bindUI();
      animate();
      document.getElementById("status").textContent =
        "Ready. Load STATIC and/or DYNAMIC LAS 1.4. Gunakan sampling (stride/maxPoints) untuk file besar.";
    });

    // expose for debugging if needed
    window.__LAS_VIEWER__ = { layers };
  </script>
</head>

<body>
  <div id="canvasWrap"></div>

  <div id="ui">
    <h1>Local LAS 1.4 Viewer (No Cesium, No Potree)</h1>

    <div class="card">
      <label>Load STATIC (.las)</label>
      <input type="file" id="fileStatic" accept=".las" />

      <label style="margin-top:10px;">Load DYNAMIC (.las)</label>
      <input type="file" id="fileDynamic" accept=".las" />

      <div id="status"></div>
    </div>

    <div class="card">
      <div class="row">
        <label><input type="checkbox" id="chkStatic" checked /> Show STATIC</label>
        <label><input type="checkbox" id="chkDynamic" checked /> Show DYNAMIC</label>
      </div>

      <label>Active layer (for controls)</label>
      <select id="activeLayer">
        <option value="static">STATIC</option>
        <option value="dynamic">DYNAMIC</option>
      </select>

      <label>Point size</label>
      <input type="range" id="ptSize" min="0.5" max="10" step="0.1" value="2" />

      <label>Opacity</label>
      <input type="range" id="opacity" min="0.05" max="1" step="0.01" value="1" />

      <button id="btnFit">Fit View</button>
    </div>

    <div class="card">
      <label>Sampling: max points loaded (per layer)</label>
      <input type="number" id="maxPoints" value="2000000" min="10000" step="10000" />

      <label>Sampling stride (1 = every point, 10 = take 1 of 10)</label>
      <input type="number" id="stride" value="5" min="1" step="1" />

      <label>Z filter (optional) - Min / Max</label>
      <div class="row">
        <input type="number" id="zMin" value="-1e20" />
        <input type="number" id="zMax" value="1e20" />
      </div>

      <label>Classification filter (comma-separated). Example: 2,5,6</label>
      <input type="text" id="classList" placeholder="empty = no filter" />

      <button id="btnRebuild">Note: For stride/maxPoints/z/class changes, re-load file</button>
    </div>

    <div class="card">
      <label>Color mode</label>
      <select id="colorMode">
        <option value="rgb">RGB (if exists)</option>
        <option value="intensity">Intensity</option>
        <option value="classification">Classification</option>
        <option value="height">Height (Z)</option>
      </select>

      <label>Intensity range</label>
      <div class="row">
        <input type="number" id="iMin" value="0" />
        <input type="number" id="iMax" value="65535" />
      </div>

      <label>Histogram (Intensity)</label>
      <canvas id="hist"></canvas>
      <button id="btnHist">Update Histogram</button>
    </div>

    <div class="card">
      <label><input type="checkbox" id="crossEnable" /> Cross section by Z band (simple)</label>
      <label>Center Z</label>
      <input type="number" id="crossZ" value="0" step="0.1" />
      <label>Half thickness (meters)</label>
      <input type="number" id="crossHalf" value="0.25" step="0.05" />
      <div style="font-size:12px; color:#9ca3af; margin-top:6px;">
        Ini cross section sederhana berbasis Z-band. Untuk profil sepanjang garis (2-click), bisa ditambah setelah workflow ini stabil.
      </div>
    </div>

    <div class="card">
      <label>Compare STATIC vs DYNAMIC (voxel analysis)</label>
      <label>Voxel size (m)</label>
      <input type="number" id="voxel" value="0.2" step="0.05" />
      <button id="btnCompare">Run Compare</button>
      <pre id="compareOut"></pre>
    </div>

    <div class="card">
      <label>Metadata</label>
      <pre id="meta"></pre>
    </div>
  </div>
</body>
</html>
