<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hybrid LiDAR Viewer + Cross Section Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body { margin:0; overflow:hidden; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      color: #fff; background: rgba(0,0,0,0.6);
      padding: 10px 12px; border-radius: 10px; max-width: 380px;
    }
    #hud b { display:block; margin-bottom:6px; }
    #hud .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #hud label { font-size: 12px; opacity: 0.9; }
    #hud input[type="range"]{ width: 180px; }
    #profileWrap{
      position: fixed; left: 10px; bottom: 10px; z-index: 10;
      background: rgba(0,0,0,0.6); border-radius: 10px; padding: 10px;
      color:#fff;
    }
    #profile { display:block; border-radius: 8px; background:#111; }
    #legend { font-size: 12px; margin-top: 6px; opacity: 0.9; }
    .pill { display:inline-block; padding:2px 8px; border-radius: 999px; margin-right: 6px; }
    .blue { background: rgba(0,160,255,0.25); border: 1px solid rgba(0,160,255,0.7); }
    .red  { background: rgba(255,80,80,0.25); border: 1px solid rgba(255,80,80,0.7); }
    #badge { font-size: 12px; opacity: 0.85; margin-top: 6px; }
  </style>
</head>

<body>
  <div id="hud">
    <b>Hybrid LiDAR Viewer</b>
    <div>Click 2 points to define the cross-section line (A → B).</div>
    <div class="row" style="margin-top:8px;">
      <label>Section width (m):</label>
      <input id="width" type="range" min="0.02" max="1.0" step="0.02" value="0.20">
      <span id="widthVal">0.20</span>
    </div>
    <div class="row" style="margin-top:6px;">
      <button id="reset">Reset section</button>
      <button id="toggleLine">Toggle line</button>
    </div>
    <div id="badge">Static = Blue, Dynamic = Red</div>
  </div>

  <div id="profileWrap">
    <div style="font-size:13px; margin-bottom:6px;">Profile / Cross Section</div>
    <canvas id="profile" width="520" height="220"></canvas>
    <div id="legend">
      <span class="pill blue">Static</span>
      <span class="pill red">Dynamic</span>
      <span style="opacity:.8;">(X = along-section distance, Y = elevation)</span>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 2000);
camera.position.set(12, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6, 1.5, 3);
controls.update();

scene.add(new THREE.GridHelper(30, 30));
scene.add(new THREE.AxesHelper(2));

// ---------- Example point clouds (replace with real data later) ----------
function createPointCloud({color, offsetX, label}) {
  const geometry = new THREE.BufferGeometry();
  const count = 120000;

  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const intensity = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const x = Math.random()*6 + offsetX;
    const z = Math.random()*6;
    // Create some "structure" so profile isn't random-flat
    const y = (Math.sin(x*0.8) + Math.cos(z*0.6))*0.5 + Math.random()*0.15 + 1.0;

    positions[i*3] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;

    colors[i*3] = color.r;
    colors[i*3+1] = color.g;
    colors[i*3+2] = color.b;

    intensity[i] = Math.random()*255; // example attribute
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('intensity', new THREE.BufferAttribute(intensity, 1));

  const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true });
  const points = new THREE.Points(geometry, material);
  points.name = label;
  return points;
}

const staticPC  = createPointCloud({ color: new THREE.Color(0.0, 0.6, 1.0), offsetX: 0.0, label: 'static' });
const dynamicPC = createPointCloud({ color: new THREE.Color(1.0, 0.25, 0.25), offsetX: 7.0, label: 'dynamic' });

scene.add(staticPC);
scene.add(dynamicPC);

// ---------- Raycast click to set section line ----------
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.12; // easier point picking
const mouse = new THREE.Vector2();

let A = null, B = null;
let sectionLine = null;
let showLine = true;

// markers
const markerGeom = new THREE.SphereGeometry(0.08, 16, 16);
const markerMatA = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
const markerMatB = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
let markerA = null, markerB = null;

function setMarker(which, pos) {
  if (which === 'A') {
    if (markerA) scene.remove(markerA);
    markerA = new THREE.Mesh(markerGeom, markerMatA);
    markerA.position.copy(pos);
    scene.add(markerA);
  } else {
    if (markerB) scene.remove(markerB);
    markerB = new THREE.Mesh(markerGeom, markerMatB);
    markerB.position.copy(pos);
    scene.add(markerB);
  }
}

function updateLine() {
  if (sectionLine) scene.remove(sectionLine);
  if (!A || !B) return;

  const geom = new THREE.BufferGeometry().setFromPoints([A, B]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff });
  sectionLine = new THREE.Line(geom, mat);
  sectionLine.visible = showLine;
  scene.add(sectionLine);
}

function pickPoint(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([staticPC, dynamicPC], false);
  if (!hits.length) return null;

  // hits[0].point is interpolated; for Points we prefer nearest vertex:
  // Many times intersect point is fine. We'll use it.
  return hits[0].point.clone();
}

renderer.domElement.addEventListener('click', (e) => {
  const p = pickPoint(e);
  if (!p) return;

  if (!A) {
    A = p; setMarker('A', A);
  } else if (!B) {
    B = p; setMarker('B', B);
    updateLine();
    computeAndDrawProfile(); // when A and B are set
  } else {
    // third click resets to new A
    A = p; B = null;
    setMarker('A', A);
    if (markerB) { scene.remove(markerB); markerB = null; }
    if (sectionLine) { scene.remove(sectionLine); sectionLine = null; }
    clearProfile();
  }
});

// ---------- Profile computation ----------
const widthSlider = document.getElementById('width');
const widthVal = document.getElementById('widthVal');
widthVal.textContent = (+widthSlider.value).toFixed(2);

widthSlider.addEventListener('input', () => {
  widthVal.textContent = (+widthSlider.value).toFixed(2);
  if (A && B) computeAndDrawProfile();
});

document.getElementById('reset').addEventListener('click', () => {
  A = null; B = null;
  if (markerA) { scene.remove(markerA); markerA = null; }
  if (markerB) { scene.remove(markerB); markerB = null; }
  if (sectionLine) { scene.remove(sectionLine); sectionLine = null; }
  clearProfile();
});

document.getElementById('toggleLine').addEventListener('click', () => {
  showLine = !showLine;
  if (sectionLine) sectionLine.visible = showLine;
});

const canvas = document.getElementById('profile');
const ctx = canvas.getContext('2d');

function clearProfile() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // background
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
  ctx.fillText('Click 2 points to define cross-section line (A → B).', 12, 22);
}
clearProfile();

function computeProfilePoints(pointsObj, colorRGBA) {
  const width = parseFloat(widthSlider.value);
  const posAttr = pointsObj.geometry.getAttribute('position');

  const dir = new THREE.Vector3().subVectors(B, A);
  const length = dir.length();
  if (length < 1e-6) return { pts: [], length: 0 };

  dir.normalize();

  // For distance-to-line: use perpendicular distance in 3D.
  // Compute parameter t along AB and distance d to line.
  const pts = [];
  const tmp = new THREE.Vector3();
  const AP = new THREE.Vector3();

  for (let i = 0; i < posAttr.count; i++) {
    tmp.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));

    AP.subVectors(tmp, A);
    const t = AP.dot(dir);         // along distance from A (meters)
    if (t < 0 || t > length) continue;

    // perpendicular distance to line
    const closest = new THREE.Vector3().copy(A).addScaledVector(dir, t);
    const d = tmp.distanceTo(closest);
    if (d > width/2) continue;

    // Profile coords: x = t (along section), y = elevation (Y)
    pts.push({ x: t, y: tmp.y, c: colorRGBA });
  }

  return { pts, length };
}

function drawAxes(xMin, xMax, yMin, yMax) {
  // background
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // frame
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(40, 18, canvas.width-52, canvas.height-48);

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '11px system-ui, -apple-system, Segoe UI, Roboto, Arial';

  ctx.fillText(`X along section (m): ${xMin.toFixed(2)} — ${xMax.toFixed(2)}`, 40, canvas.height-16);
  ctx.save();
  ctx.translate(12, canvas.height/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(`Elevation Y (m): ${yMin.toFixed(2)} — ${yMax.toFixed(2)}`, 0, 0);
  ctx.restore();
}

function computeAndDrawProfile() {
  if (!A || !B) return;

  // Compute for both
  const profStatic  = computeProfilePoints(staticPC,  'rgba(0,160,255,0.70)');
  const profDynamic = computeProfilePoints(dynamicPC, 'rgba(255,80,80,0.70)');

  const ptsAll = profStatic.pts.concat(profDynamic.pts);
  if (!ptsAll.length) {
    clearProfile();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('No points inside section width. Increase width or choose different line.', 12, 42);
    return;
  }

  // extents
  const xMin = 0;
  const xMax = Math.max(profStatic.length, profDynamic.length);
  let yMin = Infinity, yMax = -Infinity;
  for (const p of ptsAll) { yMin = Math.min(yMin, p.y); yMax = Math.max(yMax, p.y); }
  // pad
  const yPad = (yMax - yMin) * 0.05 || 0.2;
  yMin -= yPad; yMax += yPad;

  drawAxes(xMin, xMax, yMin, yMax);

  const plotX0 = 40, plotY0 = 18;
  const plotW = canvas.width - 52;
  const plotH = canvas.height - 48;

  const sx = (x) => plotX0 + ( (x - xMin) / (xMax - xMin) ) * plotW;
  const sy = (y) => plotY0 + (1 - ( (y - yMin) / (yMax - yMin) )) * plotH;

  // draw points (static first, then dynamic)
  function drawPts(arr) {
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      const px = sx(p.x);
      const py = sy(p.y);
      ctx.fillStyle = p.c;
      ctx.fillRect(px, py, 1.2, 1.2); // pixel-style for speed
    }
  }
  drawPts(profStatic.pts);
  drawPts(profDynamic.pts);

  // headline
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
  const w = parseFloat(widthSlider.value);
  ctx.fillText(`Section width = ${w.toFixed(2)} m | Static pts = ${profStatic.pts.length} | Dynamic pts = ${profDynamic.pts.length}`, 40, 12);
}

// render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
